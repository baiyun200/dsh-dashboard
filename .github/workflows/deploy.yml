name: 每日构建 & 部署 GitHub Pages

on:
  schedule:
    - cron: "30 1 * * *" # 每天 01:30 UTC（北京时间 09:30）重新抓取数据并部署
  workflow_dispatch: # 支持在 Actions 页面手动触发
  push:
    branches: [main] # 推送 main 时也部署（含数据/文档更新）

permissions:
  contents: write # 提交 Star 增长趋势图需要写权限
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 抓取最新数据（GitHub dsh-plugin 话题快照）
        run: bash scripts/fetch-data.sh

      - name: 重新生成插件数据
        run: npm run data

      - name: 生成仓库 Star 增长趋势图（README 用）
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/star-history.mjs

      - name: 提交 Star 趋势图更新（如有变化）
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/star-history.svg
          if git diff --cached --quiet; then
            echo "Star 趋势图无变化，跳过提交"
          else
            git commit -m "chore: 更新 Star 增长趋势图"
            git push
          fi

      - name: 构建站点（Pages 子路径）
        env:
          VITE_BASE: /${{ github.event.repository.name }}/
        run: npm run build

      - name: 配置 GitHub Pages
        uses: actions/configure-pages@v5

      - name: 上传构建产物
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: 部署到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
